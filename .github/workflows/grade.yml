name: grade

on: [push, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run self-check (progress meter, not pass/fail)
        id: selfcheck
        run: |
          python3 test_calculator.py | tee "$HOME/check_output.txt"
          echo "score=$(tail -1 "$HOME/check_output.txt")" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Summary
        run: echo "### Lab check — ${{ steps.selfcheck.outputs.score }}" >> $GITHUB_STEP_SUMMARY
